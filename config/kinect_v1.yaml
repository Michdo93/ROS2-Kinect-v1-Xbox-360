# ros2 launch kinect_v1_ros2 kinect_v1.launch.py [simulate:=true]
/**:                             # any node name and namespace
  ros__parameters:
    simulate: false
    device_index: 0
    frame_prefix: kinect_v1     # kinect_v1_link, kinect_v1_rgb_optical_frame
    fps: 30.0                   # simulation only – the hardware always runs at 30 Hz
    video_mode: rgb             # rgb | ir (switch at runtime with ros2 param set)
    tilt_deg: 0.0               # -27 ... 27
    led: green                  # off, green, red, yellow, blink_green, blink_red_yellow
    cloud_step: 4               # every 4th pixel: 160 x 120 points
    cloud_every: 3              # point cloud every 3rd depth frame (10 Hz)
    cloud_color: true           # rgb field from the registered RGB image
    reliable: true              # false: best effort ("sensor data") – better over Wi-Fi
    audio: false                # microphone via ALSA, needs the Kinect audio firmware
    audio_device: ""            # sounddevice index or name, empty = default
